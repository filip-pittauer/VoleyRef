<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 200 118">
  <!-- Otázka 217: detail anténky u sítě, délky jako otazníky -->
  <defs>
    <pattern id="q217-mesh" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M5 0H0V5" class="dg-mesh" /></pattern>
    <marker id="q217-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="dg-arrowhead" d="M0 0L10 5L0 10z" /></marker>
  </defs>
  <line class="dg-ground" x1="5" y1="105" x2="195" y2="105" />
  <rect class="dg-pole" x="31" y="34" width="4" height="71" />
  <!-- síť (1 m = 30 jednotek), horní okraj y = 40 -->
  <rect x="60" y="40" width="140" height="30" fill="url(#q217-mesh)" />
  <line class="dg-cord" x1="35" y1="41" x2="60" y2="41" />
  <line class="dg-cord" x1="35" y1="69" x2="60" y2="69" />
  <rect class="dg-band" x="60" y="38.6" width="140" height="3" />
  <rect class="dg-band" x="60" y="68" width="140" height="2" />
  <rect class="dg-band" x="64" y="40" width="3" height="30" />
  <!-- anténka 1,8 m = 54 jednotek, 80 cm = 24 jednotek nad sítí -->
  <line class="dg-antenna dg-antenna--thick" x1="63" y1="70" x2="63" y2="16" />
  <line class="dg-antenna dg-antenna--stripes dg-antenna--thick" x1="63" y1="40" x2="63" y2="16" />
  <g class="dg-dim">
    <line x1="46" y1="16" x2="46" y2="70" marker-start="url(#q217-arrow)" marker-end="url(#q217-arrow)" />
    <line x1="80" y1="16" x2="80" y2="38.6" marker-start="url(#q217-arrow)" marker-end="url(#q217-arrow)" />
  </g>
  <g class="dg-note">
    <text x="42" y="30" text-anchor="end">? m</text>
    <text x="85" y="28" text-anchor="start">? cm nad sítí</text>
    <text x="63" y="9">anténka</text>
    <text x="130" y="86">síť</text>
    <text x="33" y="114" class="dg-small">sloupek</text>
  </g>
</svg>
