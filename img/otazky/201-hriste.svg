<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 260 170">
  <!-- Otázka 201: hřiště a volná zóna shora, rozměry hřiště jako otazníky (na ty se otázka ptá) -->
  <defs>
    <marker id="q201-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff" /></marker>
  </defs>
  <rect class="dg-free" x="10" y="10" width="240" height="150" rx="3" />
  <rect class="dg-floor" x="40" y="40" width="180" height="90" />
  <rect class="dg-line" x="40" y="40" width="180" height="90" />
  <line class="dg-line" x1="100" y1="40" x2="100" y2="130" />
  <line class="dg-line" x1="160" y1="40" x2="160" y2="130" />
  <line class="dg-net" x1="130" y1="30" x2="130" y2="140" />
  <circle class="dg-post" cx="130" cy="30" r="2" />
  <circle class="dg-post" cx="130" cy="140" r="2" />
  <!-- kóty: délka pod hřištěm, šířka vlevo -->
  <g stroke="#fff" stroke-width="0.6">
    <line x1="40" y1="147" x2="220" y2="147" marker-start="url(#q201-arrow)" marker-end="url(#q201-arrow)" />
    <line x1="27" y1="40" x2="27" y2="130" marker-start="url(#q201-arrow)" marker-end="url(#q201-arrow)" />
  </g>
  <g class="dg-text">
    <text x="130" y="22">síť</text>
    <text x="70" y="85">pole</text>
    <text x="190" y="85">pole</text>
    <text x="85" y="154">délka ? m</text>
    <text x="19" y="85" transform="rotate(-90 19 85)">šířka ? m</text>
    <text x="205" y="22" class="dg-small">volná zóna</text>
  </g>
</svg>
